# =====================================================
# CLINGUARD - CONFIGURACION GENERAL
# =====================================================

# -----------------------------------------------------
# SERVIDOR
# -----------------------------------------------------
server.port=8080

# -----------------------------------------------------
# MONGODB ATLAS - NUEVA CUENTA
# -----------------------------------------------------
# Usuario: alexpajaro233_db_user
# Cluster: clinguard.1n5oytt.mongodb.net
# Base de datos: clinica_db

spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

# -----------------------------------------------------
# PROXY HEADERS (Para Codespaces y Render)
# -----------------------------------------------------
server.forward-headers-strategy=framework
server.use-forward-headers=true

# -----------------------------------------------------
# SEGURIDAD JWT
# -----------------------------------------------------
# Clave secreta configurada como variable de entorno
app.jwt.secret=${JWT_SECRET}

# Tiempo de expiracion del JWT: 24 horas
app.jwt.expiration-ms=86400000

# Cookie JWT para desarrollo local HTTP
# En produccion con HTTPS cambiar a true
app.jwt.cookie-secure=${JWT_COOKIE_SECURE:false}

# -----------------------------------------------------
# THYMELEAF
# -----------------------------------------------------
spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.thymeleaf.encoding=UTF-8

# -----------------------------------------------------
# SESIONES WEB Y COOKIES
# -----------------------------------------------------
# Sesion web tradicional: 15 minutos
server.servlet.session.timeout=15m

# Nombre de cookie para sesiones Spring Security
server.servlet.session.cookie.name=CLINGUARDSESSION

# Seguridad de cookie de sesion
server.servlet.session.cookie.http-only=true

# Desarrollo local HTTP
# En produccion con HTTPS cambiar a true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# -----------------------------------------------------
# CODIFICACION UTF-8
# -----------------------------------------------------
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# -----------------------------------------------------
# LOGS DE MONGODB
# -----------------------------------------------------
logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO

# -----------------------------------------------------
# GOOGLE OAUTH2 (se habilita mediante variable de entorno)
# -----------------------------------------------------
google.oauth.enabled=${GOOGLE_OAUTH_ENABLED:false}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
# Sesion OAuth2: permitir cookie en el retorno desde Google.
# En local HTTP usar *_COOKIE_SECURE=false; en produccion HTTPS, true.
server.servlet.session.cookie.same-site=lax
